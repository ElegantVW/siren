[package]
name = "siren"
version = "0.1.0"
edition = "2021"
description = "faeOS music vessel — mpv-backed player with HEOS speaker control"
license = "MIT"
publish = false

[[bin]]
name = "siren"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
