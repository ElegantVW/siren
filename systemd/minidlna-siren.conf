# House drop-in: stock minidlna.service is DynamicUser + ProtectHome=yes.
# ProtectHome mounts /home as inaccessible, so a same-path bind of
# ~/Music never attaches. Bind it onto RuntimeDirectory instead, and
# point minidlna at that path via a rewritten conf in /run/minidlna.
#
# Install: sudo cp systemd/minidlna-siren.conf /etc/systemd/system/minidlna.service.d/siren.conf
#          sudo systemctl daemon-reload && sudo systemctl restart minidlna
[Service]
ProtectHome=yes
BindReadOnlyPaths=/home/evenweaker/Music:/run/minidlna/music:rbind
ExecStart=
ExecStart=/usr/bin/minidlnad -S -f /run/minidlna/minidlna.conf
ExecStartPre=/bin/sh -c 'sed "s|/home/evenweaker/Music|/run/minidlna/music|" /etc/minidlna.conf > /run/minidlna/minidlna.conf'
